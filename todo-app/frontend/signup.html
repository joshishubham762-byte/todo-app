<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-backdrop" aria-hidden="true"></div>
  <div class="card auth-card">
    <div class="brand-mark" aria-hidden="true">✓</div>
    <h1>Create your account</h1>
    <p class="subtitle">Start organizing your tasks</p>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" required />
        <div class="field-error" id="nameError" aria-live="polite"></div>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
        <div class="field-error" id="emailError" aria-live="polite"></div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" minlength="6" required />
        <div class="field-error" id="passwordError" aria-live="polite"></div>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" minlength="6" required />
        <div class="field-error" id="confirmPasswordError" aria-live="polite"></div>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-text">Sign Up</span>
      </button>
    </form>

    <p class="footer-link">Already have an account? <a href="index.html">Log in</a></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
